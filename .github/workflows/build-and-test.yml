name: Build and Test

on:
  push:
    branches: [ main, feat/rt-performance-monitoring ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Build Docker image
      run: |
        docker build -t rt-performance-monitor:latest .

    - name: Run a short test cycle
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        # Run a 5 second test to ensure no crashes
        python src/cpu_worker.py --duration 5 --interval 1
        python src/network_worker.py --duration 5 --interval 0.5
