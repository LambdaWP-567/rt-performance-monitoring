<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="4" fill="#1a1a1a"/>

  <!-- Red glow behind RT text -->
  <text x="2" y="20"
        font-family="'Courier New', monospace"
        font-weight="bold"
        font-size="18"
        fill="#ff0000"
        filter="url(#glow)">RT</text>

  <!-- RT text (crisp, on top) -->
  <text x="2" y="20"
        font-family="'Courier New', monospace"
        font-weight="bold"
        font-size="18"
        fill="#ff2200">RT</text>

  <!--
    Oscilloscope trace: two regular pulses flanking one tall jitter spike.
    The spike (centre) represents the latency outlier the tool detects.
  -->
  <polyline
    points="2,28 4,28 5,25 7,25 8,28 11,28 12.5,22 14,28 18,28 19,25 21,25 22,28 30,28"
    fill="none"
    stroke="#ff3300"
    stroke-width="1.5"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <!-- Jitter spike accent in brighter orange-red -->
  <polyline
    points="11,28 12.5,22 14,28"
    fill="none"
    stroke="#ff6600"
    stroke-width="1.8"
    stroke-linejoin="round"
    stroke-linecap="round"/>

  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
</svg>
